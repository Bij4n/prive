name: Advisories

# Checks Cargo.lock against the RustSec advisory database. Weekly, and whenever the lock
# file changes. Reported, not blocking, until 1.0.
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    paths: ["Cargo.lock"]
  workflow_dispatch:

jobs:
  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
