name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: prive-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: prive-linux-x86_64-musl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: prive-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: prive-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: prive-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
