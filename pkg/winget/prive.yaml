PackageIdentifier: Bij4n.Prive
PackageVersion: 0.4.0
PackageName: prive
Publisher: Bij4n
PublisherUrl: https://github.com/Bij4n
ShortDescription: Cross-platform CLI password manager and PGP encryption toolkit
Description: |-
  Prive is a single-binary, zero-runtime-dependency CLI password manager and PGP
  encryption toolkit. Features include AES-256-GCM encrypted vaults, PGP key management,
  password generation (random, passphrase, pronounceable, PIN), TOTP/2FA support,
  security auditing with Have I Been Pwned breach detection, and an interactive TUI.
License: MIT
