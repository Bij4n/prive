[package]
name = "prive"
version = "0.1.0"
edition = "2024"
description = "Cross-platform password & encryption toolkit"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rand = "0.8"
colored = "2"
rpassword = "7"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
