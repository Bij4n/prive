[package]
name = "prive"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "Fast, scriptable terminal client for KeePass (KDBX) password databases"
license = "MIT"
repository = "https://github.com/Bij4n/prive"
readme = "README.md"
keywords = ["password-manager", "keepass", "kdbx", "totp", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
base32 = "0.5"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dirs = "6"
hex = "0.4"
hmac = "0.12"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
zeroize = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
