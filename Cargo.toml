[package]
name = "prive"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Fast, scriptable terminal client for KeePass (KDBX) password databases"
license = "MIT"
repository = "https://github.com/Bij4n/prive"
readme = "README.md"
keywords = ["password-manager", "keepass", "kdbx", "totp", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
