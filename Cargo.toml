[package]
name = "prive"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "Fast, scriptable terminal client for KeePass (KDBX) password databases"
license = "MIT"
repository = "https://github.com/Bij4n/prive"
readme = "README.md"
keywords = ["password-manager", "keepass", "kdbx", "totp", "cli"]
categories = ["command-line-utilities"]
# What goes into the crates.io package: the code, the word list and its licence note, docs.
include = [
  "/src",
  "/assets",
  "/examples",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
base32 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
dirs = "6"
hex = "0.4"
hmac = "0.12"
keepass = "0.13"
nucleo-picker = "0.11"
rand = "0.9"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
ureq = "3"
zeroize = "1"
zxcvbn = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["socket", "user", "process", "resource", "fs", "poll"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[lints.rust]
# Denied everywhere; the one reviewed exception is the Windows handle fix in clip.rs.
unsafe_code = "deny"

[lints.clippy]
# No placeholders: a command either works or doesn't exist.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[dev-dependencies]
assert_cmd = "2"
clap_mangen = "0.3"
predicates = "3"
proptest = "1"
tempfile = "3"

# Key derivation is very slow in unoptimised builds; keep debug builds and tests quick.
[profile.dev.package.rust-argon2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
