[package]
name = "prive"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "Fast, scriptable terminal client for KeePass (KDBX) password databases"
license = "MIT"
repository = "https://github.com/Bij4n/prive"
readme = "README.md"
keywords = ["password-manager", "keepass", "kdbx", "totp", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
base32 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dirs = "6"
hex = "0.4"
hmac = "0.12"
rand = "0.9"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
ureq = "3"
zeroize = "1"
zxcvbn = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
