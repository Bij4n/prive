[package]
name = "prive"
version = "0.4.0"
edition = "2024"
description = "Cross-platform password & encryption toolkit"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rand = "0.8"
colored = "2"
rpassword = "7"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1"
aes-gcm = "0.10"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
zeroize = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tabled = "0.17"
pgp = "0.14"
smallvec = "1"
hex = "0.4"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base32 = "0.5"
totp-lite = "2"
ratatui = "0.29"
crossterm = "0.28"
fuzzy-matcher = "0.3"
reqwest = { version = "0.12", features = ["blocking"] }
base64 = "0.22"
quick-xml = "0.37"
zxcvbn = "3"
clap_mangen = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "crypto_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
strip = true
