[package]
name = "prive"
version = "0.1.0"
edition = "2024"
description = "Cross-platform password & encryption toolkit"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rand = "0.8"
colored = "2"
rpassword = "7"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1"
aes-gcm = "0.10"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
zeroize = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tabled = "0.17"
pgp = "0.14"
smallvec = "1"
hex = "0.4"
