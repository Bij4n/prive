# cargo-deny: what may enter the dependency tree. Run with
#   cargo deny check licenses bans sources
# (security advisories are checked by the separate weekly RustSec workflow).

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "BSL-1.0",
  "Unicode-3.0",
  # Mozilla root certificates, via webpki-roots.
  "CDLA-Permissive-2.0",
  # File-level copyleft, unmodified upstream crates (the picker's matcher, option-ext).
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
